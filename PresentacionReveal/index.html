<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mi Presentación - Reveal.js</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Reveal.js desde CDN -->
  <link rel="stylesheet" href="https://unpkg.com/reveal.js@4/dist/reveal.css">
  <link rel="stylesheet" href="https://unpkg.com/reveal.js@4/dist/theme/solarized.css">
</head>
<body>
  <div class="reveal">
    <div class="slides">
      <section>
        <h1>Lo logre </h1>
        <p>Por fin / Cristian Avalo</p>
      </section>
      <section>
        <h2>Seguir aprendiendo</h2>
        <ul>
          <li>con todo</li>
          <li>y mas</li>
        </ul>
      </section>
      <section>
        <h2>Demo / Código</h2>
        <pre><code>Soy profesor('soy estudiante');</code></pre>
      </section>
      <section>
        <h2>Gracias</h2>
        <p>Muchas</p>
      </section>
    </div>
  </div>

  <script src="https://unpkg.com/reveal.js@4/dist/reveal.js"></script>
  <script>
    Reveal.initialize({
      hash: true,
      slideNumber: true,
      controls: true,
      progress: true
    });
  </script>
</body>
</html>
